<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Swap error responses too, so that the server can show an error message. -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":".*","swap":true}]}'>
  <title>Commute Agent</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.2/sse.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #f3f5fa;
      --surface: #ffffff;
      --text: #172033;
      --muted: #5f6b85;
      --border: #e1e6ef;
      --accent: #2563eb;
      --accent-2: #0ea5a4;
      --on-accent: #ffffff;
      --link: #3b5b8f;
      --error-bg: #fdecec;
      --error-text: #a11d2a;
      --shadow: 0 1px 2px rgb(16 24 40 / 0.05), 0 2px 8px rgb(16 24 40 / 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d121c;
        --surface: #161d2a;
        --text: #e6eaf2;
        --muted: #94a0b8;
        --border: #263044;
        --accent: #4f86ff;
        --accent-2: #2dd4bf;
        --link: #a9bddf;
        --error-bg: #3a1a1f;
        --error-text: #ffb3ba;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 2px 8px rgb(0 0 0 / 0.25);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--on-accent);
    }
    h1 { margin: 0; font-size: 1.1rem; }
    header p { margin: 0; color: var(--muted); font-size: 0.875rem; }
    .new {
      margin-left: auto;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .new:hover { border-color: var(--accent); color: var(--accent); }

    #alerts:empty { display: none; }
    #alerts { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 0; }
    .alert {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      background: var(--surface);
      font-size: 0.875rem;
    }
    .alert.failed { border-left-color: var(--error-text); }
    .alert.sent, .alert.answered, .alert.rejected { border-left-color: var(--border); color: var(--muted); }
    .alert-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .alert-actions input, .alert-actions select, .alert-actions button {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    .alert-actions input[type="number"] { width: 6.5em; }
    .alert-actions input[type="text"] { flex: 1; min-width: 12em; }
    .alert-actions button { cursor: pointer; }
    .alert-actions button:first-of-type { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .alert-error { margin-top: 6px; color: var(--error-text); }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
    }
    #messages { display: flex; flex-direction: column; gap: 12px; }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      overflow-wrap: anywhere;
      animation: rise 0.18s ease-out;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: var(--on-accent);
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow);
    }
    .msg.error {
      align-self: flex-start;
      background: var(--error-bg);
      color: var(--error-text);
      border-bottom-left-radius: 4px;
    }
    .msg > :first-child { margin-top: 0; }

    /* The tool calls of a reply, and the steps of the agent. */
    .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font: 500 0.75rem ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
    }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; }
    .pill.ok::before { background: #16a34a; }
    .pill.failed { color: var(--error-text); border-color: currentColor; }
    .pill.failed::before { background: currentColor; }
    .notice { margin-top: 8px; font-size: 0.8125rem; font-style: italic; color: var(--muted); }
    .trace { margin-top: 10px; font-size: 0.8125rem; color: var(--muted); }
    .trace summary { cursor: pointer; }
    .step { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .step-title { font-weight: 600; color: var(--text); }
    .label { margin-top: 6px; font-weight: 600; }
    .label.failed { color: var(--error-text); }
    .time { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
    .trace pre {
      max-height: 220px;
      margin: 4px 0 0;
      padding: 8px;
      overflow: auto;
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.75rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .msg > :last-child { margin-bottom: 0; }
    .msg p, .msg ol, .msg ul { margin: 0.5em 0; }
    .msg ol, .msg ul { padding-left: 1.4em; }
    .msg li + li { margin-top: 0.2em; }
    .msg img { display: block; max-width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--border); }
    /* Links have one soft color, also when visited, and an underline so that they stay clear. */
    a, a:visited { color: var(--link); text-decoration-color: color-mix(in srgb, var(--link) 45%, transparent); text-underline-offset: 2px; }
    a:hover { text-decoration-color: currentColor; }
    .msg .credit { margin-top: 4px; color: var(--muted); font-size: 0.75rem; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .chip {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }

    /* The placeholder of a reply shows each step of the agent while it works. */
    .progress-line { font-size: 0.8125rem; color: var(--muted); }
    .progress-line + .progress-line { margin-top: 2px; }
    .progress-line.ok::before { content: "\2713  "; color: #16a34a; }
    .progress-line.failed { color: var(--error-text); }
    .progress-line.failed::before { content: "\2717  "; }
    .typing { display: flex; gap: 4px; padding: 8px 0 2px; }
    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    form {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin: 0 16px 16px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    form:focus-within { border-color: var(--accent); }
    textarea {
      flex: 1;
      field-sizing: content;
      min-height: 40px;
      max-height: 160px;
      padding: 8px 10px;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    form button {
      display: grid;
      place-items: center;
      flex: none;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      cursor: pointer;
    }
    form button:disabled, textarea:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/>
          <path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/>
        </svg>
      </div>
      <div>
        <h1>Commute Agent</h1>
        <p>Routes and live traffic details on demand</p>
      </div>
      <!-- The server gives the browser a new conversation ID, and the reload shows an empty conversation. -->
      <button type="button" class="new" hx-post="/conversations" hx-swap="none" hx-on::after-request="location.reload()">New conversation</button>
    </header>

    <!-- The requests for feedback after a trip. They do not refresh while the user types in them. -->
    <section id="alerts" aria-live="polite" hx-get="/alerts" hx-trigger="load, every 30s [!document.activeElement?.closest('#alerts')], refreshAlerts from:body"></section>

    <main id="log">
      <div id="messages" aria-live="polite">
        <div class="msg assistant">Hi! Ask me any questions about your commute.</div>
      </div>
    </main>

    <form hx-post="/messages"
          hx-target="#messages"
          hx-swap="beforeend scroll:#log:bottom"
          hx-disabled-elt="find textarea, find button">
      <textarea name="content" rows="1" placeholder="Ask about your commute" aria-label="Message" autofocus></textarea>
      <button type="submit" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </form>
  </div>

  <script>
    const form = document.querySelector("form");
    const input = form.querySelector("textarea");
    const log = document.getElementById("log");
    const messages = document.getElementById("messages");

    const scrollDown = () => log.scrollTo({ top: log.scrollHeight, behavior: "smooth" });

    // add puts a message in the conversation. textContent keeps user text as text.
    function add(className, text) {
      const el = document.createElement("div");
      el.className = "msg " + className;
      el.textContent = text;
      messages.append(el);
      requestAnimationFrame(scrollDown);
    }

    // Show the message of the user at once, because the reply can take some time.
    // An empty message is not sent.
    form.addEventListener("htmx:configRequest", (event) => {
      const text = (event.detail.parameters.content || "").trim();
      if (!text) {
        event.preventDefault();
        return;
      }
      add("user", text);
      input.value = "";
      document.getElementById("suggestions")?.remove();
    });

    // A network failure has no response to swap, so show a message here.
    form.addEventListener("htmx:sendError", () => add("error", "The agent is not available. Is the server running?"));
    form.addEventListener("htmx:afterRequest", () => setTimeout(() => input.focus()));

    // Keep the newest step of the agent in view while it works. At the end of a
    // turn, get the alerts again, so that a new request for feedback shows at
    // once.
    document.body.addEventListener("htmx:sseMessage", (event) => {
      requestAnimationFrame(scrollDown);
      if (event.detail.type === "done") {
        htmx.trigger(document.body, "refreshAlerts");
      }
    });

    // If the event stream of a turn fails, for example because the server
    // stopped, stop it and show an error, so that the browser does not connect
    // again and again.
    document.body.addEventListener("htmx:sseError", (event) => {
      event.detail.source?.close();
      const turn = event.target.closest(".turn");
      if (turn) {
        turn.outerHTML = '<div class="msg error">The connection to the agent was lost. Is the server running?</div>';
      }
    });

    // Render the Markdown of each reply. DOMPurify removes any unsafe HTML that
    // the model writes.
    htmx.onLoad((root) => {
      root.querySelectorAll?.("[data-md]").forEach((el) => {
        el.innerHTML = DOMPurify.sanitize(marked.parse(el.textContent));
        el.removeAttribute("data-md");
        // The base of each route map comes from OpenStreetMap, which must be credited.
        el.querySelectorAll('img[src^="/maps/"]').forEach((img) =>
          img.insertAdjacentHTML("afterend", '<div class="credit">Map © OpenStreetMap contributors</div>')
        );
      });
    });

    // A click on a tool pill opens the steps of its reply.
    messages.addEventListener("click", (event) => {
      const pill = event.target.closest(".pill");
      const trace = pill?.closest(".msg").querySelector(".trace");
      if (trace) {
        trace.open = true;
        trace.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    });

    // Enter sends the message, and Shift+Enter starts a new line.
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll(".chip").forEach((chip) =>
      chip.addEventListener("click", () => {
        input.value = chip.textContent;
        form.requestSubmit();
      })
    );
  </script>
</body>
</html>
